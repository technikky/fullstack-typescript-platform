apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/technikky/platform-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # Read at runtime and injected into the page by the layout, so this image is identical
            # in every environment. `NEXT_PUBLIC_` would inline it at build time and require one
            # image per environment -- which means the artefact promoted to production is not the one
            # that was tested in staging.
            #
            # These are the URLs the *browser* resolves, so they are the public ingress hostnames,
            # not in-cluster service names a browser cannot reach.
            - name: PLATFORM_API_URL
              value: https://api.platform.example.com
            - name: PLATFORM_WS_URL
              value: wss://api.platform.example.com/ws
          # The client has no dependencies of its own, so liveness and readiness are the same check.
          # Splitting them would suggest a distinction that does not exist here.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Next writes its image-optimisation cache under `.next/cache` at runtime, which a
            # read-only root filesystem forbids.
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
