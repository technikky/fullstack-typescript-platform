apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: platform
spec:
  replicas: 3
  # Three so that a rolling update, a node drain and a pod failure can overlap without dropping
  # below two. With two replicas, `maxUnavailable: 0` plus a drain leaves one pod carrying
  # everything.
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the declared replicas during a deploy. Surge costs one pod's worth of
      # resources for a minute; unavailability costs requests.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/component: api
    spec:
      # Matches the application's own 15s shutdown backstop, plus headroom for the pre-stop sleep
      # below. Shorter and Kubernetes SIGKILLs mid-drain, which is the thing the graceful shutdown
      # exists to prevent.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread across nodes, so one node failure cannot take every replica. `ScheduleAnyway`
      # rather than `DoNotSchedule`: on a small cluster a hard constraint leaves pods Pending,
      # and being unbalanced beats being unscheduled.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/technikky/platform-api:latest
          # `IfNotPresent` with a `latest` tag would silently keep an old image. A real deployment
          # pins a digest and drops this entirely; `Always` is the honest default while the tag is
          # mutable.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: platform-config
            # Created out of band; see the README. Never committed.
            - secretRef:
                name: platform-secrets
          # Liveness and readiness point at *different* endpoints, which is the decision that
          # matters most here.
          #
          # `/health` answers as long as the process is alive. `/ready` checks the database and
          # Redis. Pointing liveness at `/ready` would mean a brief database blip restarts every
          # replica at once -- turning a recoverable dependency outage into a total one, and
          # restarting pods that were not broken.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            # One failed check takes the pod out of the load balancer. Being quick to withdraw is
            # cheap; being slow means requests keep arriving at a pod that cannot serve them.
            failureThreshold: 1
          # A slow start must not be mistaken for a crash. Without this, `livenessProbe` begins
          # counting failures while the process is still applying the schema, and the pod is killed
          # and restarted forever.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          # Requests come from the load test in `server/src/bench/loadtest.ts` rather than from a
          # guess: it sustained ~990 req/s on one core with the in-process database. The limit is
          # 4x the request so a burst is absorbed rather than throttled, and memory's request and
          # limit are equal because a container that exceeds a memory limit is OOM-killed rather
          # than slowed -- so there is no benefit in letting it grow toward one.
          #
          # These are a starting point to be revised against real traffic, not a measurement of
          # production.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # `readOnlyRootFilesystem` needs somewhere writable for anything that spills to disk.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                # Endpoint removal propagates to kube-proxy and the ingress asynchronously, so a
                # pod can still receive connections for a second or two after it starts
                # terminating. Sleeping before the process sees SIGTERM is what makes a deploy
                # actually drop zero requests.
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: platform
spec:
  selector:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
  # WebSocket connections are long-lived, so a client should stay on the pod it authenticated
  # against for the life of the connection. `ClientIP` is a blunt instrument -- it also pins HTTP
  # requests -- but the alternative is a reconnect storm every time the session moves.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: platform
spec:
  # Two must stay up through a voluntary disruption -- a node drain or a cluster upgrade. Expressed
  # as a minimum rather than `maxUnavailable: 1` so it stays correct if `replicas` changes.
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
      app.kubernetes.io/component: api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    # CPU, not request rate. Request rate needs a metrics adapter and a per-request cost that is
    # stable enough to divide by -- and this workload's is not: a listing is far cheaper than a
    # contended update. CPU is a proxy that needs no extra infrastructure and does not lie about
    # which requests are expensive.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # React quickly to load.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Five minutes before scaling in. Scaling down promptly looks efficient and causes
      # flapping: every removed pod drops its WebSocket connections, and those clients reconnect
      # onto the remaining pods, which raises their CPU, which scales back up.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
