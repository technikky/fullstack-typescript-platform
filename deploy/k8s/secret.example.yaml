# The SHAPE of the secret, for review. Never apply this file, and never commit a real one.
#
# base64 in a Secret is encoding, not encryption: `kubectl get secret -o yaml` prints it back in one
# command, and a committed Secret is a committed credential with an extra step. `stringData` is used
# here rather than `data` precisely so nobody mistakes the encoding for protection.
#
# Create the real one out of band:
#
#   kubectl -n platform create secret generic platform-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL='postgres://platform:REAL@postgres:5432/platform' \
#     --from-literal=POSTGRES_PASSWORD='REAL'
#
# For anything beyond evaluation, use External Secrets Operator or Sealed Secrets so the source of
# truth is a secret manager and rotation is not a manual step somebody has to remember.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
type: Opaque
stringData:
  JWT_SECRET: REPLACE-WITH-AT-LEAST-32-RANDOM-CHARACTERS
  DATABASE_URL: postgres://platform:REPLACE@postgres:5432/platform
  POSTGRES_PASSWORD: REPLACE
