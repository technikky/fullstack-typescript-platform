apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform

# Applied to every resource, so `kubectl delete -l app.kubernetes.io/name=platform` is a complete
# teardown and a dashboard can group the whole platform with one selector.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: platform
      app.kubernetes.io/part-of: platform

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml

# secret.example.yaml is deliberately NOT listed. It holds placeholders, and applying it would
# overwrite a real secret with them. See README.md for how the real one is created.
